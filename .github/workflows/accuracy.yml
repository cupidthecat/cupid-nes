name: NES hardware accuracy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc
            cpp_compiler: g++
            flags: -std=c11 -Wall -Wextra -Werror -O2
          - name: Clang with sanitizers
            compiler: clang
            cpp_compiler: clang++
            flags: -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
    name: ${{ matrix.name }}
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out emulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out diagnostic ROMs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: christopherpow/nes-test-roms
          ref: 95d8f621ae55cee0d09b91519a8989ae0e64753b
          path: build/diagnostic-roms
          persist-credentials: false
      - name: Check out AccuracyCoin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100thCoin/AccuracyCoin
          ref: 9bc42d1e3acbeeaea215b1011d58f4ce72a8a49e
          path: build/accuracycoin
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libsdl2-dev
      - name: Package reproducible validation inputs
        if: matrix.compiler == 'gcc'
        run: |
          mkdir -p build/validation-inputs/include
          git archive --format=tar HEAD | gzip -n > build/validation-inputs/source.tar.gz
          tar --exclude=.git -czf build/validation-inputs/diagnostics.tar.gz -C build diagnostic-roms accuracycoin
          cp -a /usr/include/SDL2 build/validation-inputs/include/
          if [ -d /usr/include/x86_64-linux-gnu/SDL2 ]; then
            mkdir -p build/validation-inputs/include/x86_64-linux-gnu
            cp -a /usr/include/x86_64-linux-gnu/SDL2 build/validation-inputs/include/x86_64-linux-gnu/
          fi
          cp /usr/share/doc/libsdl2-dev/copyright build/validation-inputs/SDL2-COPYRIGHT
          {
            printf 'emulator=%s\n' "$(git rev-parse HEAD)"
            printf 'diagnostics=%s\n' "$(git -C build/diagnostic-roms rev-parse HEAD)"
            printf 'accuracycoin=%s\n' "$(git -C build/accuracycoin rev-parse HEAD)"
            sdl2-config --version
            sha256sum build/accuracycoin/AccuracyCoin.nes
          } > build/validation-inputs/manifest.txt
      - name: Upload validation inputs
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-inputs-${{ github.sha }}
          path: build/validation-inputs/
          if-no-files-found: error
          retention-days: 7
      - name: Check source file sizes
        run: python3 scripts/check-source-size.py
      - name: Build emulator and run hardware regressions
        run: make -j2 CC='${{ matrix.compiler }}' CXX='${{ matrix.cpp_compiler }}' CFLAGS='${{ matrix.flags }}' all test
      - name: Check network sessions
        run: python3 scripts/check-netplay.py build/accuracy-tests
      - name: Check region launch options
        run: python3 scripts/check-region-cli.py ./cupid-nes
      - name: Check game database discovery
        run: python3 scripts/check-game-database-cli.py ./cupid-nes
      - name: Check CPU trace and diagnostic ROMs
        run: python3 scripts/run-diagnostics.py build/accuracy-tests build/diagnostic-roms
      - name: Check all 144 AccuracyCoin tests
        run: |
          echo '7e25ac08d2e7ed14c9b1f16bd853148fef09a824452164f8e0d69fd2bd96176c  build/accuracycoin/AccuracyCoin.nes' | sha256sum --check --strict
          build/accuracy-tests --accuracycoin 12000 build/accuracycoin/AccuracyCoin.nes build/accuracycoin.ppm
